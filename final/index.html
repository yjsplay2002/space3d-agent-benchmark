<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000005" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>우리 태양계 탐험</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="loading">
    <div class="loading-inner">
      <div class="loading-title">우리 태양계 탐험</div>
      <div class="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-text">우주선 시동 거는 중...</div>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <header id="hud-top">
    <h1>우리 태양계 탐험</h1>
    <p id="hud-hint">행성을 클릭해 보세요 · 마우스 휠로 확대/축소</p>
  </header>

  <div class="hud-topcenter">
    <span class="scale-badge">※ 크기와 거리는 실제 비율이 아니에요</span>
  </div>

  <button id="btn-overview" hidden>← 전체 보기 (ESC)</button>
  <button id="btn-info" hidden>ⓘ 정보 보기</button>

  <aside id="info-panel" hidden>
    <div class="panel-grabber" id="panel-grabber"></div>
    <button id="panel-close" aria-label="정보 닫기">×</button>
    <div class="panel-body">
      <div class="ip-header">
        <div class="panel-emoji" id="p-emoji"></div>
        <div class="ip-title">
          <div class="ip-namerow"><h2 id="p-name"></h2><span class="p-eng" id="p-eng"></span></div>
          <div class="p-type" id="p-type"></div>
        </div>
      </div>
      <p class="p-desc" id="p-desc"></p>
      <button id="btn-impact">☄️ 소행성 충돌시키기</button>
      <div class="stats" id="p-stats"></div>
      <div class="spin-note" id="p-spin"></div>
      <h3>재미있는 사실</h3>
      <ul id="p-facts"></ul>
    </div>
  </aside>

  <!-- 소행성 충돌 실험 패널 — 데스크톱: 우측 사이드 / 모바일: 하단 시트 -->
  <aside id="impact-panel" hidden>
    <div class="panel-grabber" id="impact-grabber"></div>
    <button id="impact-close" aria-label="충돌 실험 닫기">×</button>
    <div class="panel-body impact-body">

      <div id="impact-controls">
        <div class="impact-title">☄️ 소행성 충돌 실험</div>
        <div class="impact-target" id="impact-target"></div>

        <div class="ctl-row">
          <label>소행성 크기(지름) <b id="val-size">1 km</b></label>
          <input type="range" id="in-size" min="0" max="1" step="0.001" value="0.4" />
        </div>
        <div class="ctl-row">
          <label>충돌 속도 <b id="val-speed">20 km/s</b></label>
          <input type="range" id="in-speed" min="11" max="72" step="1" value="20" />
        </div>
        <div class="ctl-row">
          <label>충돌 각도 <b id="val-angle">45°</b></label>
          <input type="range" id="in-angle" min="15" max="90" step="1" value="45" />
        </div>

        <div class="ctl-row">
          <label>무엇으로 된 소행성인가요?</label>
          <div class="comp-group" id="comp-group">
            <button class="comp-btn active" data-comp="rock">🪨 암석</button>
            <button class="comp-btn" data-comp="iron">⚙️ 철</button>
            <button class="comp-btn" data-comp="ice">🧊 얼음</button>
          </div>
        </div>

        <div class="impact-live">
          <div><span>소행성 무게</span><b id="live-mass">—</b></div>
          <div><span>충돌 에너지</span><b id="live-energy">—</b></div>
        </div>

        <button id="btn-fire">☄️ 발사!</button>
        <div class="impact-note" id="impact-note" hidden></div>
      </div>

      <div id="impact-result" hidden>
        <div class="grade-badge" id="grade-badge"></div>
        <p class="grade-desc" id="grade-desc"></p>
        <div class="stats" id="impact-stats"></div>
        <div class="spin-note impact-changes" id="impact-changes"></div>
        <div class="impact-actions">
          <button id="btn-again">🔁 다시 하기</button>
          <button id="btn-restore">✨ 원래대로</button>
        </div>
      </div>

    </div>
  </aside>

  <aside id="moon-panel">
    <div class="moon-title">오늘 밤 달의 모습</div>
    <div class="moon-sub" id="moon-date">지구에서 보면</div>
    <canvas id="moon-canvas" width="256" height="256"></canvas>
    <div class="moon-name" id="moon-name">—</div>
    <div class="moon-rows">
      <div><span>조명률</span><b id="moon-illum">—</b></div>
      <div><span>월령</span><b id="moon-age">—</b></div>
      <div><span>다음 보름달</span><b id="moon-next">—</b></div>
    </div>
  </aside>

  <footer id="time-bar">
    <button id="btn-pause" title="일시정지/재생">⏸</button>
    <div class="tb-divider"></div>
    <div class="tb-speed">
      <div class="tb-speed-label"><span class="tb-speed-note">시간 속도</span><span id="speed-label">10×</span></div>
      <input type="range" id="speed" min="0" max="4" step="0.01" value="2" />
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
