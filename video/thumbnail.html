<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>thumbnail</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:grid;place-items:center;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
/* 1 unit = 1% of the frame width, so the composition scales to any capture size
   and can be resampled to 1280x720 without redesigning anything. */
.t{--u:calc(min(100vw, 177.7778vh) / 100);
  width:calc(var(--u)*100);height:calc(var(--u)*56.25);
  position:relative;overflow:hidden;background:#07080B}
.bg{position:absolute;inset:0;background-image:url("screenshots/fable5.jpg");
  background-size:cover;background-position:58% 45%}
/* Darken the left half only — the art stays readable on the right where the
   solar system actually is. */
.veil{position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(4,5,8,.96) 0%,rgba(4,5,8,.92) 34%,
    rgba(4,5,8,.55) 54%,rgba(4,5,8,.12) 74%,rgba(4,5,8,.35) 100%)}
.wrap{position:absolute;inset:0;padding:calc(var(--u)*6) calc(var(--u)*5.5);
  display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*2.2)}
.eyebrow{font-size:calc(var(--u)*3.1);font-weight:800;letter-spacing:.02em;
  color:#E8B54B;text-shadow:0 calc(var(--u)*.2) calc(var(--u)*.8) rgba(0,0,0,.9)}
h1{font-size:calc(var(--u)*9.6);line-height:1.02;font-weight:900;color:#fff;
  letter-spacing:-.035em;max-width:calc(var(--u)*52);
  text-shadow:0 calc(var(--u)*.35) calc(var(--u)*1.6) rgba(0,0,0,.95)}
h1 em{font-style:normal;color:#E8B54B}
.models{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.9);max-width:calc(var(--u)*54)}
.models span{font-size:calc(var(--u)*2.35);font-weight:700;color:#EDEFF3;
  background:rgba(16,18,24,.82);border:calc(var(--u)*.13) solid rgba(232,181,75,.45);
  border-radius:calc(var(--u)*1);padding:calc(var(--u)*.7) calc(var(--u)*1.5);
  backdrop-filter:blur(calc(var(--u)*.4))}
.badge{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*5);
  display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*.5)}
.badge b{font-size:calc(var(--u)*6.4);font-weight:900;color:#fff;line-height:1;
  text-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.2) rgba(0,0,0,.95)}
.badge b i{font-style:normal;color:#E8695F}
.badge span{font-size:calc(var(--u)*1.9);font-weight:700;color:#C9CDD6;
  text-shadow:0 calc(var(--u)*.2) calc(var(--u)*.8) rgba(0,0,0,.95)}
</style></head>
<body>
<div class="t">
  <div class="bg"></div><div class="veil"></div>
  <div class="wrap">
    <p class="eyebrow">최신 AI 코딩 모델</p>
    <h1><em>4개</em><br>동시 비교</h1>
    <div class="models">
      <span>Opus 5</span><span>Fable 5</span><span>GPT-5.6 Sol</span><span>Grok 4.5</span>
    </div>
  </div>
  <div class="badge"><b>3개<i> 깨짐</i></b><span>테스트는 전부 만점</span></div>
</div>
</body></html>
